# El server de nginx que va dentro de la imagen de la web: http en el puerto 80.
# Las reglas (la web, las rutas de la SPA y el proxy de /api y /socket.io) están en studate-app.conf.
#
# Para HTTPS no se cambia la imagen: el repo de despliegue (STUDATE---DOCKER) monta en su lugar un
# default.conf con un server en el 443, el certificado y la redirección del 80, que incluye el mismo
# studate-app.conf.

server {
    listen 80;
    server_name _;

    include /etc/nginx/studate-app.conf;
}
