# Lo que nginx hace con la web de Studate, sea por http o por https. Este fichero no es un server
# entero: son las reglas (location) que se incluyen dentro de un server con "include". Así el server
# de http (default.conf, en la imagen) y el de https (en el repo de despliegue, montado desde fuera)
# comparten las mismas reglas y no hay que escribirlas dos veces.
#
#   1. Sirve los ficheros compilados de la web (dist/).
#   2. Las rutas de la SPA: /dates, /admin/usuarios... no son ficheros, son rutas de React Router. Si no
#      existe el fichero se devuelve index.html y React Router pinta la pantalla. Sin esto, recargar en
#      /dates daría 404 (es lo que le pasaba al Seminario 10, que usaba la configuración por defecto).
#   3. Hace de puerta única: /api va a la API y /socket.io al chat, dentro de la red de Docker. El
#      navegador solo habla con nginx, así que no hay CORS y la cookie del refresh token vive en
#      /api/auth (REFRESH_COOKIE_PATH de la API).
#
# "api" es el nombre del servicio de la API en el docker compose; nginx lo resuelve por la red interna.
#
# Ojo con cómo se resuelve ese nombre: si se escribe fijo en proxy_pass, nginx lo convierte en IP una
# sola vez, al arrancar, y se la queda. Cuando el compose recrea el contenedor de la API (por ejemplo,
# al cambiar una variable del .env), la API cambia de IP y nginx sigue apuntando a la vieja: 502 en
# /api hasta reiniciar la web. Pasó en el primer despliegue en el servidor. Con el DNS de Docker como
# resolver y el nombre en una variable, nginx lo vuelve a resolver cada pocos segundos.

resolver 127.0.0.11 valid=10s ipv6=off;
set $api http://api:1337;

root /usr/share/nginx/html;
index index.html;

# Las fotos de perfil van en base64 dentro del JSON (hasta 200 KB): el límite por defecto (1 MB) sobra,
# pero se deja escrito para que se sepa dónde cambiarlo
client_max_body_size 2m;

# La API. El rewrite quita el prefijo: /api/users/me llega a la API como /users/me (con el nombre en
# una variable, proxy_pass no puede quitarlo con la barra final, así que se hace con rewrite)
location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# El chat (socket.io, a partir del bloque de Mis Dates). Un WebSocket empieza como una petición HTTP
# que pide "cambiar de protocolo" (Upgrade): hay que dejar pasar esas dos cabeceras y no cortar la
# conexión por inactividad
location /socket.io/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
}

# Los ficheros con hash en el nombre (assets/index-D3xG9oj6.js) cambian de nombre en cada build, así
# que el navegador los puede guardar un año: nunca verá uno viejo
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Todo lo demás: el fichero si existe y, si no, index.html (rutas de la SPA)
location / {
    try_files $uri $uri/ /index.html;
}
